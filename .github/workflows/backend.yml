name:  Devops

on:
  push:
    branches:
      - main
    paths:
      - 'user-backend/**'
      - 'user-frontend/**'
  workflow_dispatch:

jobs:
  security-build-deploy:
    runs-on: ubuntu-latest

    steps:

      # ===============================
      # 1️⃣ Checkout Repository
      # ===============================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ===============================
      # 2️⃣ SAST - Semgrep (Whole Repo)
      # ===============================
      - name: Run Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"

      # ===============================
      # 3️⃣ Setup Node (For Snyk + Frontend)
      # ===============================
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # ===============================
      # 4️⃣ Install Snyk CLI
      # ===============================
      - name: Install Snyk CLI
        run: npm install -g snyk

      # ===============================
      # 5️⃣ Backend SCA - Snyk
      # ===============================
      - name: Run Snyk Scan (Backend)
        working-directory: user-backend
        run: |
          snyk test \
            --file=pom.xml \
            --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # ===============================
      # 6️⃣ Frontend Dependencies Install
      # ===============================
      - name: Install Frontend Dependencies
        working-directory: user-frontend
        run: npm install

      # ===============================
      # 7️⃣ Frontend SCA - Snyk (Production Only)
      # ===============================
      - name: Run Snyk Scan (Frontend)
        working-directory: user-frontend
        run: |
          snyk test \
            --file=package-lock.json \
            --severity-threshold=high \
            --dev=false
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # ===============================
      # 8️⃣ IaC Scan - Backend
      # ===============================
      - name: Run Trivy IaC Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: './user-backend'
          scanners: misconfig

      # ===============================
      # 9️⃣ IaC Scan - Frontend
      # ===============================
      - name: Run Trivy IaC Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: './user-frontend'
          scanners: misconfig

      # ===============================
      # 🔟 Docker Login
      # ===============================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ===============================
      # 1️⃣1️⃣ Build Backend Image (latest)
      # ===============================
      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/um-backend:latest \
            ./user-backend

      - name: Push Backend Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/um-backend:latest

      # ===============================
      # 1️⃣2️⃣ Build Frontend Image (latest)
      # ===============================
      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/um-frontend:latest \
            ./user-frontend

      - name: Push Frontend Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/um-frontend:latest

      # ===============================
      # 1️⃣3️⃣ Trivy Image Scan - Backend
      # ===============================
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/um-backend:latest
          severity: HIGH,CRITICAL
          exit-code: 1

      # ===============================
      # 1️⃣4️⃣ Trivy Image Scan - Frontend
      # ===============================
      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/um-frontend:latest
          severity: HIGH,CRITICAL
          exit-code: 1
