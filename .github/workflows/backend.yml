name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'user-backend/**'
  workflow_dispatch:

jobs:
  security-build-deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1️⃣ Checkout Code
      # -------------------------
      - name: Checkout Code
        uses: actions/checkout@v3

      # -------------------------
      # 2️⃣ SAST - Semgrep
      # -------------------------
      - name: Run Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/owasp-top-ten"

      # -------------------------
      # 3️⃣ SCA - Snyk
      # -------------------------
      -  name: Run Snyk
         run: |
            cd user-backend
            snyk test --file=pom.xml --severity-threshold=high
         env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # -------------------------
      # 4️⃣ IaC Scan - Trivy
      # -------------------------
      - name: Run Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './user-backend'
          scanners: 'misconfig'

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/um-backend:latest ./user-backend

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/um-backend:latest
