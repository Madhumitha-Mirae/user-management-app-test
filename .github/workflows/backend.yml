name: Secure CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

# ===============================
# 1️⃣ SAST - SEMGREP
# ===============================
  semgrep-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (Generate SARIF)
        run: |
          pip install semgrep
          semgrep --config p/default --sarif --output semgrep-report.sarif

      - name: Upload Semgrep Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.sarif

# ===============================
# 2️⃣ SCA - SNYK
# ===============================
  snyk-scan:
    name: SCA Scan (Snyk)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Test (Generate JSON Report)
        run: snyk test --all-projects --json-file-output=snyk-report.json || true

      - name: Upload Snyk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json

# ===============================
# 3️⃣ IaC SCAN - TRIVY
# ===============================
  trivy-iac:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy IaC Scan (Generate JSON)
        run: |
          docker run --rm \
            -v $PWD:/project \
            aquasec/trivy config \
            --format json \
            -o /project/trivy-iac-report.json \
            /project

      - name: Upload Trivy IaC Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-iac-report
          path: trivy-iac-report.json

# ===============================
# 4️⃣ BUILD BACKEND IMAGE
# ===============================
  build-backend:
    name: Build Backend
    needs: [semgrep-scan, snyk-scan, trivy-iac]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/um-backend:latest ./user-backend

      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/um-backend:latest

# ===============================
# 5️⃣ BUILD FRONTEND IMAGE
# ===============================
  build-frontend:
    name: Build Frontend
    needs: [semgrep-scan, snyk-scan, trivy-iac]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/um-frontend:latest ./user-frontend

      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/um-frontend:latest

# ===============================
# 6️⃣ TRIVY CONTAINER SCAN
# ===============================
  trivy-image:
    name: Trivy Container Scan
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Scan Backend Image (Generate JSON)
        run: |
          docker run --rm \
            -v $PWD:/project \
            aquasec/trivy image \
            --format json \
            -o /project/backend-image-report.json \
            ${{ secrets.DOCKER_USERNAME }}/um-backend:latest

      - name: Scan Frontend Image (Generate JSON)
        run: |
          docker run --rm \
            -v $PWD:/project \
            aquasec/trivy image \
            --format json \
            -o /project/frontend-image-report.json \
            ${{ secrets.DOCKER_USERNAME }}/um-frontend:latest

      - name: Upload Backend Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-report
          path: backend-image-report.json

      - name: Upload Frontend Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-report
          path: frontend-image-report.json
