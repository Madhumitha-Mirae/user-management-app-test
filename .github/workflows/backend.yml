name: Full Stack CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'user-backend/**'
      - 'user-frontend/**'
  workflow_dispatch:

jobs:
  security-build-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # ===============================
      # 🔐 SAST - Semgrep (Whole Repo)
      # ===============================
      - name: Run Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"

      # ===============================
      # 🟢 Setup Node (For Snyk + Frontend)
      # ===============================
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # ===============================
      # 🔎 Backend SCA - Snyk
      # ===============================
      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk Scan (Backend)
        run: |
          cd user-backend
          snyk test --file=pom.xml --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # ===============================
      # 🔎 Frontend SCA - Snyk
      # ===============================
      - name: Install Frontend Dependencies
        run: |
          cd user-frontend
          npm install

      - name: Run Snyk Scan (Frontend)
        run: |
          cd user-frontend
          snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # ===============================
      # 🏗 IaC Scan (Both Folders)
      # ===============================
      - name: Run Trivy IaC Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: './user-backend'
          scanners: misconfig

      - name: Run Trivy IaC Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: './user-frontend'
          scanners: misconfig

      # ===============================
      # 🐳 Docker Login
      # ===============================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ===============================
      # 🐳 Build Backend Image (latest)
      # ===============================
      - name: Build Backend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/um-backend:latest ./user-backend

      - name: Push Backend Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/um-backend:latest

      # ===============================
      # 🐳 Build Frontend Image (latest)
      # ===============================
      - name: Build Frontend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/um-frontend:latest ./user-frontend

      - name: Push Frontend Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/um-frontend:latest

      # ===============================
      # 🔎 Trivy Image Scan - Backend
      # ===============================
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/um-backend:latest
          severity: HIGH,CRITICAL
          exit-code: 1

      # ===============================
      # 🔎 Trivy Image Scan - Frontend
      # ===============================
      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/um-frontend:latest
          severity: HIGH,CRITICAL
          exit-code: 1
