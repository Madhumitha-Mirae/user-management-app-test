name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'user-backend/**'
  workflow_dispatch:

jobs:
  security-build-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ SAST - Semgrep
      - name: Run Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"

      # 3️⃣ Setup Node (for Snyk)
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 4️⃣ Install Snyk CLI
      - name: Install Snyk CLI
        run: npm install -g snyk

      # 5️⃣ SCA - Snyk
      - name: Run Snyk Scan
        run: |
          cd user-backend
          snyk test --file=pom.xml --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 6️⃣ IaC - Trivy Scan
      - name: Run Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: './user-backend'
          scanners: misconfig

      # 7️⃣ Docker Login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 8️⃣ Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/um-backend:${{ github.sha }} ./user-backend

      # 9️⃣ Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/um-backend:${{ github.sha }}

      # 🔟 Trivy Container Image Scan
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/um-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1
